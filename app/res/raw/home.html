<script>const audioMap={};
let paper=null,fullTextById={},metaById={},queue=[],queuePos=0,currentMode='offline',currentFilter='all',currentStage='active',editingId=null,spellId=null,wrongItems=[],wrongOffset=0,wrongHasMore=false,currentUnitIndex=0;
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ttsStatus(t){$('#tts').textContent=t}function toastStatus(t){ttsStatus(t)}
function markPlaying(id){$$('.playing').forEach(x=>x.classList.remove('playing'));let e=document.getElementById(id);if(e){let c=e.closest('.item,.wrongcard,.choice');if(c)c.classList.add('playing')}}
function entry(text,id,zh,kind){fullTextById[id]=text;metaById[id]={text,translation:zh||'',kind:kind||'sentence',unitId:paper.unitId||'',unitTitle:paper.title||'',itemId:(paper._itemIds||{})[id]||'',audioResource:(paper._audio||{})[id]||''};return `<div class="entry"><div><div id="${id}" class="${kind==='letter'?'english lettertext':'english'}">${kind==='letter'?'🔤 ':''}${esc(text)}</div>${zh?`<div class="translation">${esc(zh)}</div>`:''}</div><button class="round speak" data-id="${id}" aria-label="发音">🔊</button><button class="round wrongadd" data-id="${id}" aria-label="记错题">＋</button></div>`}
function classify(t){return /^\s*[A-Za-z]+(?:['’-][A-Za-z]+)*\s*$/.test(t)?'word':(t.trim().split(/\s+/).length<=5&&!/[.!?]/.test(t)?'phrase':'sentence')}
function render(p){paper=p;paper._itemIds={};paper._audio={};(p.sections||[]).forEach((sec,si)=>(sec.items||[]).forEach((it,ii)=>{let id=`p${si}i${ii}`;paper._itemIds[id]=it.itemId||'';paper._audio[id]=it.audioResource||''}));fullTextById={};metaById={};$('#unitButtonTitle').textContent=p.shortTitle||p.title||'单元';$('#unitButtonDesc').textContent=p.subtitle||'';let h='';(p.sections||[]).forEach((sec,si)=>{h+=`<section class="section"><h2>${esc(sec.title||'练习')}</h2>${sec.description?`<div class="secdesc">📖 ${esc(sec.description)}</div>`:''}`;(sec.items||[]).forEach((it,ii)=>{let id=`p${si}i${ii}`,t=it.text||it.stem||'';h+='<div class="item">'+entry(t,id,it.translation,it.type==='letter'?'letter':classify(t));(it.options||[]).forEach((o,oi)=>{let oid=id+'o'+oi;h+=`<div class="choice">${entry(o,oid,'',classify(o))}</div>`});h+='</div>'});h+='</section>'});$('#paper').innerHTML=h||'<div class="empty">暂无内容</div>';requestCounts()}
function playText(text,id,next){let resource=(metaById[id]&&metaById[id].audioResource)||audioMap[text];if(!resource&&currentMode==='offline'){ttsStatus('该内容暂无离线音频');if(next)setTimeout(nextAudio,400);return}Android.play(paper&&paper.unitId?paper.unitId:'',resource||'',text,String(id),!!next)}
function speakById(id){queue=[];let t=fullTextById[id];if(t)playText(t,id,false)}function allLines(){return Object.keys(metaById).filter(k=>!k.includes('o'))}function playAll(){queue=allLines();queuePos=0;nextAudio()}function nextAudio(){if(queuePos>=queue.length){ttsStatus('连读完成');return}let id=queue[queuePos++],t=fullTextById[id];if(t)playText(t,id,true);else nextAudio()}function stop(){queue=[];Android.stop();$$('.playing').forEach(x=>x.classList.remove('playing'));ttsStatus('已停止')}
function tokenize(text){let a=[],r=/[A-Za-z]+(?:['’-][A-Za-z]+)*/g,m,i=0;while((m=r.exec(text)))a.push({word:m[0],index:i++});return a}function makeKey(m){return (m.unitId||'')+'|'+m.text}
function openMistake(id){editingId=id;let m=metaById[id],old=wrongItems.find(x=>x.key===makeKey(m));$('#mistakeText').textContent=m.text;$$('.check').forEach(x=>x.classList.toggle('selected',old?old.types.includes(x.dataset.error):false));let selected=old?(old.words||[]).map(w=>w.index):[];if(m.kind==='word'&&!selected.length)selected=[0];$('#wordTokens').innerHTML=tokenize(m.text).map(x=>`<button class="token ${selected.includes(x.index)?'selected':''}" data-index="${x.index}">${esc(x.word)}</button>`).join('');$('#mistakeTip').textContent='';$('#mistakeModal').classList.add('open')}
function saveMistake(){let m=metaById[editingId],types=$$('.check.selected').map(x=>x.dataset.error),indices=$$('#wordTokens .token.selected').map(x=>+x.dataset.index),tokens=tokenize(m.text);if(!types.length){$('#mistakeTip').textContent='请至少选择一种错误类型';return}if(!indices.length){$('#mistakeTip').textContent='请点选具体出错的单词';return}let obj={key:makeKey(m),source_item_id:m.itemId||'',text:m.text,translation:m.translation,content_type:m.kind,unit_id:m.unitId,unit_title:m.unitTitle,types,words:indices.map(i=>({index:i,word:(tokens.find(t=>t.index===i)||{}).word||''}))};$('#saveMistake').disabled=true;$('#mistakeTip').textContent='正在保存…';Android.saveMistake(JSON.stringify(obj))}
function mistakeSaved(m){$('#saveMistake').disabled=false;$('#mistakeModal').classList.remove('open');ttsStatus(m);requestWrong(true);requestCounts()}function wrongBookError(m){$('#saveMistake').disabled=false;ttsStatus('操作失败：'+m)}function wrongBookChanged(m){ttsStatus(m);requestWrong(true);requestCounts()}function archiveFinished(m){ttsStatus(m);requestWrong(true);requestCounts()}
function highlighted(x){let bad=new Set((x.words||[]).map(w=>w.index)),cursor=0,out='',r=/[A-Za-z]+(?:['’-][A-Za-z]+)*/g,m,i=0;while((m=r.exec(x.text))){out+=esc(x.text.slice(cursor,m.index));out+=bad.has(i)?`<span class="badword">${esc(m[0])}</span>`:esc(m[0]);cursor=m.index+m[0].length;i++}return out+esc(x.text.slice(cursor))}
function requestWrong(reset){if(reset){wrongOffset=0;wrongItems=[];$('#wrongList').innerHTML='<div class="empty">正在读取错题…</div>'}Android.requestWrongList(currentStage,currentFilter,50,wrongOffset)}
function receiveWrongList(payload){let r=JSON.parse(payload);wrongItems=wrongOffset===0?r.items:wrongItems.concat(r.items);wrongHasMore=!!r.hasMore;wrongOffset=wrongItems.length;renderWrong()}
function requestCounts(){Android.requestWrongCounts()}function receiveWrongCounts(payload){let c=JSON.parse(payload);$('#activeCount').textContent=c.active;$('#masteredCount').textContent=c.mastered;let b=$('#wrongBadge');b.textContent=c.active;b.hidden=!c.active;$('#wrongSummary').textContent=currentStage==='mastered'?c.mastered+' 条已掌握':c.active+' 条待练习'}
function renderWrong(){
 let html='';
 if(wrongItems.length){
  html=wrongItems.map(x=>{let actions=x.stage==='mastered'?'<button class="smallbtn restore" data-act="restore">重新练习</button><button class="smallbtn remove" data-act="delete">删除</button>':`<button class="smallbtn master ${x.mastered?'done':''}" data-act="master">${x.mastered?'✓ 掌握':'掌握'}</button><button class="smallbtn remove ${x.mastered?'':'locked'}" data-act="archive">移出</button>`;return `<article class="wrongcard ${x.stage==='mastered'?'archived':''}" data-wid="${x.id}"><div class="wrongmeta">${x.types.includes('pronunciation')?'<span class="tag">发音</span>':''}${x.types.includes('writing')?'<span class="tag write">书写</span>':''}${x.stage==='mastered'?'<span class="tag" style="background:#e8f7f1;color:#16805f">已收好</span>':''}</div><div class="wrongtext">${highlighted(x)}</div>${x.translation?`<div class="translation">${esc(x.translation)}</div>`:''}<div class="wrongactions"><button class="smallbtn" data-act="listen">🔊 听</button><button class="smallbtn practice" data-act="spell">✍ 拼</button>${actions}</div></article>`}).join('');
  if(wrongHasMore)html+='<button id="loadMore" class="loadmore">继续加载</button>';
 }else{html='<div class="empty"><div class="emptyicon">'+(currentStage==='mastered'?'📚':'🌟')+'</div>'+(currentStage==='mastered'?'掌握过的内容会一直保存在这里<br>期中、期末可以回来复习':'当前没有需要练习的错题<br>继续保持！')+'</div>'}
 $('#wrongList').innerHTML=html;let more=$('#loadMore');if(more)more.addEventListener('click',()=>requestWrong(false));
